<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 230" role="img" aria-label="Dave Cleaning Services">
  <defs>
    <pattern id="haz" width="30" height="30" patternUnits="userSpaceOnUse" patternTransform="rotate(-45)">
      <rect width="30" height="30" fill="#14a1e6"/>
      <rect width="15" height="30" fill="#ffffff"/>
    </pattern>
    <clipPath id="card">
      <rect x="4" y="4" width="452" height="222" rx="16"/>
    </clipPath>
  </defs>

  <rect x="4" y="4" width="452" height="222" rx="16" fill="#14a1e6" stroke="#ffffff" stroke-width="6"/>

  <g clip-path="url(#card)">
    <!-- top hazard band -->
    <rect x="16" y="16" width="428" height="30" fill="url(#haz)"/>
    <!-- side hazard brackets -->
    <rect x="16" y="46" width="26" height="118" fill="url(#haz)"/>
    <rect x="418" y="46" width="26" height="118" fill="url(#haz)"/>
    <!-- bottom hazard band (above divider) -->
    <rect x="16" y="150" width="428" height="18" fill="url(#haz)"/>
  </g>

  <!-- DAVE -->
  <text x="230" y="132" text-anchor="middle"
        font-family="'Arial Black','Helvetica Neue',Arial,sans-serif"
        font-weight="900" font-size="104" letter-spacing="6" fill="#ffffff">DAVE</text>

  <!-- divider -->
  <rect x="14" y="176" width="432" height="5" fill="#ffffff"/>

  <!-- CLEANING SERVICES -->
  <text x="230" y="212" text-anchor="middle"
        font-family="'Arial Black','Helvetica Neue',Arial,sans-serif"
        font-weight="900" font-size="36" letter-spacing="4" fill="#ffffff">CLEANING SERVICES</text>
</svg>
